{% extends 'base.html' %}
{% block title %}Отмена брони — StudyRoomBooking{% endblock %}
{% block content %}
<section class="section">
    <h1>Отменить бронирование?</h1>
    <p>{{ booking }} — {{ booking.get_status_display }}</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, отменить</button>
        <a href="{% url 'bookings:my' %}" class="btn btn-outline">Нет</a>
    </form>
</section>
{% endblock %}
