{% extends 'base.html' %}
{% block title %}Удаление оборудования — StudyRoomBooking{% endblock %}
{% block content %}
<section class="section">
    <h1>Удалить оборудование?</h1>
    <p>{{ obj }} — связи с аудиториями будут удалены.</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'rooms:equipment' %}" class="btn btn-outline">Отмена</a>
    </form>
</section>
{% endblock %}
